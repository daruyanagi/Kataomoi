<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Kataomoi fixture</title>
<link rel="stylesheet" href="../src/content.css">
<style>
  /*
   * x.com の実際の DOM をなぞった擬似マークアップ。
   * data-testid の付き方と、表示名まわりが flex column / row のどちらになるかは
   * 本物に合わせてある（ここを適当にすると 💔 の挿入位置のバグを見逃す）。
   *
   * 本物の UserCell は <button> だが、HTML パーサーは button の入れ子を許さず
   * 中のフォローボタンが外に押し出されてしまうため、ここだけ div[role=button] にしている。
   */
  body { font-family: "Segoe UI", "Hiragino Sans", sans-serif; padding: 20px; max-width: 660px; }
  .col { display: flex; flex-direction: column; }
  .row { display: flex; flex-direction: row; align-items: center; }
  [data-testid="UserCell"] { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #eff3f4; width: 100%; background: none; border-width: 0 0 1px; text-align: left; font: inherit; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #cfd9de; flex: none; }
  .body { flex: 1; }
  .name { font-weight: 700; color: #0f1419; }
  .handle { color: #536471; }
  a { text-decoration: none; color: inherit; }
  [data-testid="userFollowIndicator"] { display: inline-block; margin-left: 6px; padding: 0 4px; border-radius: 4px; background: #eff3f4; color: #536471; font-size: 12px; }
  .bio { color: #0f1419; }
  .follow-btn { margin-left: auto; border-radius: 9999px; border: 1px solid #cfd9de; background: #fff; padding: 6px 16px; font-weight: 700; }
  h3 { margin: 24px 0 4px; font-size: 14px; color: #536471; }
  #result { margin-top: 24px; padding: 12px; background: #f7f9f9; white-space: pre; font-family: ui-monospace, monospace; font-size: 13px; }
</style>
</head>
<body>

<h3>ユーザー一覧</h3>
<div id="list">

  <!-- A: フォロー中 かつ フォローされていない => 💔 -->
  <div data-testid="UserCell" role="button" id="cellA">
    <div data-testid="UserAvatar-Container-kataomoi_san"><a href="/kataomoi_san"><div class="avatar"></div></a></div>
    <div class="body col">
      <div class="row">
        <div class="col">
          <div class="col">
            <a href="/kataomoi_san" class="col"><div class="row"><div class="row"><span><span class="name">片思いさん</span></span></div><div></div></div></a>
          </div>
          <div class="row"><div><a href="/kataomoi_san"><div><span class="handle">@kataomoi_san</span></div></a></div><div></div></div>
        </div>
        <div><button class="follow-btn" data-testid="111-unfollow"><span><span>フォロー中</span></span></button></div>
      </div>
      <div class="bio"><span>よろしくお願いします</span></div>
    </div>
  </div>

  <!-- B: フォロー中 かつ フォローされている => なし -->
  <div data-testid="UserCell" role="button" id="cellB">
    <div data-testid="UserAvatar-Container-ryoomoi_san"><a href="/ryoomoi_san"><div class="avatar"></div></a></div>
    <div class="body col">
      <div class="row">
        <div class="col">
          <div class="col">
            <a href="/ryoomoi_san" class="col"><div class="row"><div class="row"><span><span class="name">両思いさん</span></span></div><div></div></div></a>
          </div>
          <div class="row"><div><a href="/ryoomoi_san"><div><span class="handle">@ryoomoi_san</span></div></a></div><div><div data-testid="userFollowIndicator"><span>フォローされています</span></div></div></div>
        </div>
        <div><button class="follow-btn" data-testid="222-unfollow"><span><span>フォロー中</span></span></button></div>
      </div>
    </div>
  </div>

  <!-- C: フォローしていない => なし -->
  <div data-testid="UserCell" role="button" id="cellC">
    <div data-testid="UserAvatar-Container-mishiranu"><a href="/mishiranu"><div class="avatar"></div></a></div>
    <div class="body col">
      <div class="row">
        <div class="col">
          <div class="col">
            <a href="/mishiranu" class="col"><div class="row"><div class="row"><span><span class="name">見知らぬ人</span></span></div><div></div></div></a>
          </div>
          <div class="row"><div><a href="/mishiranu"><div><span class="handle">@mishiranu</span></div></a></div><div></div></div>
        </div>
        <div><button class="follow-btn" data-testid="333-follow"><span><span>フォロー</span></span></button></div>
      </div>
    </div>
  </div>

  <!-- D: 自己紹介に "Follows you" を含む片思い => 💔（誤判定しないこと） -->
  <div data-testid="UserCell" role="button" id="cellD">
    <div data-testid="UserAvatar-Container-tricky"><a href="/tricky"><div class="avatar"></div></a></div>
    <div class="body col">
      <div class="row">
        <div class="col">
          <div class="col">
            <a href="/tricky" class="col"><div class="row"><div class="row"><span><span class="name">紛らわしい人</span></span></div><div></div></div></a>
          </div>
          <div class="row"><div><a href="/tricky"><div><span class="handle">@tricky</span></div></a></div><div></div></div>
        </div>
        <div><button class="follow-btn" data-testid="444-unfollow"><span><span>フォロー中</span></span></button></div>
      </div>
      <div class="bio" data-testid="UserDescription"><span>Follows you</span></div>
    </div>
  </div>

  <!-- E: userFollowIndicator が無く文字列だけのケース（英語 UI）=> なし -->
  <div data-testid="UserCell" role="button" id="cellE">
    <div data-testid="UserAvatar-Container-english"><a href="/english"><div class="avatar"></div></a></div>
    <div class="body col">
      <div class="row">
        <div class="col">
          <div class="col">
            <a href="/english" class="col"><div class="row"><div class="row"><span><span class="name">English User</span></span></div><div></div></div></a>
          </div>
          <div class="row"><div><a href="/english"><div><span class="handle">@english</span></div></a></div><div><span>Follows you</span></div></div>
        </div>
        <div><button class="follow-btn" data-testid="555-unfollow"><span><span>Following</span></span></button></div>
      </div>
    </div>
  </div>

</div>

<h3>プロフィールヘッダー（片思い）</h3>
<div id="profileHeader">
  <div data-testid="UserName">
    <div><div><div class="col">
      <div class="row"><div class="row"><span><span class="name">プロフィールさん</span></span><span></span></div></div>
      <div class="row"><div><div><div><span class="handle">@profile_san</span></div></div></div></div>
    </div></div></div>
    <div></div>
  </div>
  <div data-testid="placementTracking">
    <button class="follow-btn" data-testid="999-unfollow"><span><span>フォロー中</span></span></button>
  </div>
</div>

<div id="result">running…</div>

<script>
// content.js は拡張機能として動く前提なので chrome.* を最小限スタブする
window.chrome = {
  storage: {
    sync: { get: (defaults, cb) => cb(defaults) },
    onChanged: { addListener: () => {} }
  },
  runtime: { onMessage: { addListener: () => {} } }
};
</script>
<script src="../src/content.js"></script>
<script>
const EXPECTED = { cellA: 1, cellB: 0, cellC: 0, cellD: 1, cellE: 0, profileHeader: 1 };

setTimeout(() => {
  const lines = [];
  let ok = true;

  for (const [id, want] of Object.entries(EXPECTED)) {
    const got = document.querySelectorAll('#' + id + ' .kataomoi-heart').length;
    const pass = got === want;
    ok = ok && pass;
    lines.push((pass ? 'PASS' : 'FAIL') + ' ' + id + ' 💔=' + got + ' (期待 ' + want + ')');
  }

  // 💔 が表示名と同じ行に入っているか（縦積みの親に入れると改行してしまう）
  for (const heart of document.querySelectorAll('.kataomoi-heart')) {
    const dir = getComputedStyle(heart.parentElement).flexDirection;
    const pass = dir === 'row';
    ok = ok && pass;
    lines.push((pass ? 'PASS' : 'FAIL') + ' 挿入先が横並び (' + heart.parentElement.textContent.trim().slice(0, 12) + ') flex-direction=' + dir);
  }

  lines.push(ok ? '=> ALL PASS' : '=> SOME FAILED');
  document.getElementById('result').textContent = lines.join('\n');
}, 600);
</script>
</body>
</html>
