<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Kataomoi promo tile</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 440px; height: 280px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: linear-gradient(160deg, #fff 0%, #fff1f3 100%);
    font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: #0f1419;
  }
  .heart { width: 84px; height: 84px; }
  h1 { margin: 0; font-size: 38px; font-weight: 800; letter-spacing: .02em; }
  p { margin: 0; font-size: 15px; color: #536471; text-align: center; line-height: 1.5; }
  .strong { color: #f4212e; font-weight: 700; }
</style>
</head>
<body>
  <img class="heart" src="../icons/icon128.png" alt="">
  <h1>Kataomoi</h1>
  <p>フォローしているのに<span class="strong">フォローされていない</span>人に<br>💔 を表示します</p>
</body>
</html>
